name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # El repo trae el wrapper de Gradle, que es un jar binario. Esto verifica
      # que sea uno oficial y no uno cambiado: si no, cualquier pull request
      # podria meter codigo que corre en el CI sin que se note en el diff.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: ./gradlew test

      # Las pruebas cubren Main.run(), pero no el script que genera el empaque
      # ni el codigo de salida de verdad, que es justo el contrato que promete
      # el README para usarla como reja en un CI ajeno.
      - name: Probar el empaque contra el log de ejemplo
        run: |
          ./gradlew --quiet installDist
          code=0
          ./build/install/nplusone/bin/nplusone ejemplos/pedidos.log || code=$?
          if [ "$code" -ne 1 ]; then
            echo "se esperaba salir con 1 (hay hallazgos), salio con $code"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reporte-de-pruebas
          path: build/reports/tests/test
